  <section id="two">
    <h2>Form</h2>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
      <br><br>

      <label for="pw">Password</label>
      <input type="password" id="pw" name="password">
      <br><br>

      <label for="em">Email</label>
      <input type="email" id="em" name="email">
      <br><br>

      <input type="checkbox" name="agree" value="yes"> I agree <br><br>

      Campus:
      <input type="radio" name="campus" value="kharian"> Kharian
      <input type="radio" name="campus" value="islamabad"> Islamabad
      <br><br>

      <label for="bio">Bio</label><br>
      <textarea id="bio" name="bio" rows="3"></textarea>
      <br><br>

      <label for="day">Day</label>
      <select id="day" name="day">
        <option value="mon">Monday</option>
        <option value="tue">Tuesday</option>
        <option value="wed">Wednesday</option>
      </select>

      <label for="city">City</label>
      <input type="text" id="city" name="city" list="cities">
      <datalist id="cities">
        <option value="Kharian">
        <option value="Gujrat">
      </datalist>
      <br><br>

      <fieldset>
        <legend>Your details</legend>
        <label for="dob">Date</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="n">Number</label>
        <input type="number" id="n" name="seats" min="1" max="40"><br><br>

        <label for="col">Colour</label>
        <input type="color" id="col" name="col" value="#1a2744"><br><br>

        <label for="vol">Range</label>
        <input type="range" id="vol" name="vol" min="0" max="10"><br><br>

        <label for="cv">File</label>
        <input type="file" id="cv" name="cv"><br><br>

        <button type="submit">Send</button>
        <button type="reset">Clear</button>
      </fieldset>
    </form>
  </section>

  <section id="three">
    <h2>Shapes</h2>
